[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurel-memory-b"
version = "3.0.0"
description = "AUREL-Mem B: evidence-grounded multimodal memory API"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "openai", "numpy", "pillow", "python-dotenv", "json-repair", "tiktoken"]

[project.optional-dependencies]
models = ["mlx-lm", "transformers", "sentencepiece", "protobuf"]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aurel_memory*"]
